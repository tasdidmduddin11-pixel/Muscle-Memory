name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4   # or @v5 when you’re ready
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the Android platform files (safe even if some already exist)
      - run: flutter create --platforms=android --org com.musclememory --project-name muscle_memory .

      # Your custom AndroidManifest
      - run: |
          rm -rf test
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      # Enable core library desugaring (needed for flutter_local_notifications etc.)
      - run: python3 tools/patch_gradle.py

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: muscle-memory-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
